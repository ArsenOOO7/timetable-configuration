spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.xml

---
spring:
  config:
    active:
      on-profile: local
  liquibase:
    contexts: local
  datasource:
    url: jdbc:postgresql://localhost:5432/pnu_system
    username: postgres
    password: postgres

---
spring:
  config:
    active:
      on-profile: production

