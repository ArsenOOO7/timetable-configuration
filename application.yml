spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.xml
  jpa:
    properties:
      hibernate:
        default_schema: ${spring.liquibase.default-schema}

timetable:
  security:
    allowed-origins:
      - http://localhost:5173

---
spring:
  config:
    active:
      on-profile: local
  liquibase:
    contexts: local
    user: postgres
    password: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/pnu_system
    username: postgres
    password: postgres
  jpa:
    show-sql: true

---
spring:
  config:
    active:
      on-profile: production

